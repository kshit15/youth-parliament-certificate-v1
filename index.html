<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Certificate Generator — Prebaked precise placement</title>
  <style>
    body {
      font-family: system-ui, Arial;
      margin: 18px;
      display: flex;
      gap: 18px;
    }
    #controls {
      width: 300px;
    }
    label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
    }
    button {
      margin-top: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }
    canvas {
      border: 1px solid #ccc;
      max-width: 850px;
      height: auto;
      display: block;
    }
    .hint {
      font-size: 13px;
      color: #555;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div id="controls">
    <h2>Fill details</h2>

    <label>Name
      <input id="nameInput" type="text" placeholder="Enter name">
    </label>

    <label>Participation
      <input id="partInput" type="text" placeholder="Event (e.g. Youth Parliament)">
    </label>

    <label>Adjudged
      <input id="adjInput" type="text" placeholder="Adjudged (e.g. Best Delegate)">
    </label>

    <label>Font size (name)
      <input id="sizeName" type="number" value="46" min="10" max="200">
    </label>

    <label>Font size (other)
      <input id="sizeOther" type="number" value="32" min="10" max="200">
    </label>

    <label>Font family
      <select id="fontFamily">
        <option>Times New Roman</option>
        <option>Georgia</option>
        <option>serif</option>
        <option>Arial</option>
        <option>cursive</option>
      </select>
    </label>

    <button id="download">Download PNG</button>
  </div>

  <div>
    <canvas id="c"></canvas>
  </div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.src = "IMG-20250922-WA0013.jpg";

  const nameInput = document.getElementById('nameInput');
  const partInput = document.getElementById('partInput');
  const adjInput  = document.getElementById('adjInput');
  const sizeName  = document.getElementById('sizeName');
  const sizeOther = document.getElementById('sizeOther');
  const fontFamily= document.getElementById('fontFamily');

  // certificate image is 986x704 pixels
  const width = 986;
  const height = 704;

  // fixed coordinates (left-anchored, precisely placed)
  const coords = {
    name: { x: 539, y: 210, maxWidth: 400 },
    part: { x: 292, y: 270, maxWidth: 500 },
    adj:  { x: 343, y: 320, maxWidth: 500 }
  };

  img.onload = () => {
    canvas.width = width;
    canvas.height = height;
    draw();
  };

  function draw() {
    ctx.clearRect(0, 0, width, height);
    ctx.drawImage(img, 0, 0, width, height);

    ctx.fillStyle = "#000";
    ctx.textBaseline = "top";
    ctx.textAlign = "left";

    // draw name
    ctx.font = `${parseInt(sizeName.value,10)}px ${fontFamily.value}`;
    drawLeftAnchored(nameInput.value || "", coords.name);

    // draw participation
    ctx.font = `${parseInt(sizeOther.value,10)}px ${fontFamily.value}`;
    drawLeftAnchored(partInput.value || "", coords.part);

    // draw adjudged
    ctx.font = `${parseInt(sizeOther.value,10)}px ${fontFamily.value}`;
    drawLeftAnchored(adjInput.value || "", coords.adj);
  }

  function drawLeftAnchored(text, pos) {
    if (!text) return;
    const words = text.split(/\s+/);
    const lines = [];
    let line = "";
    for (let w of words) {
      const test = line ? line + " " + w : w;
      const wpx = ctx.measureText(test).width;
      if (wpx > pos.maxWidth && line) {
        lines.push(line);
        line = w;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);

    const lineHeight = parseInt(ctx.font.match(/\d+/)) * 1.05;
    let y = pos.y;
    for (let ln of lines) {
      ctx.fillText(ln, pos.x, y);
      y += lineHeight;
    }
  }

  [nameInput, partInput, adjInput, sizeName, sizeOther, fontFamily].forEach(el => {
    el.addEventListener('input', draw);
  });

  document.getElementById('download').addEventListener('click', () => {
    draw();
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = "certificate.png";
      a.click();
    });
  });
})();
</script>

</body>
</html>
